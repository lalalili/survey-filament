name: CI

on: [push, pull_request]

jobs:
  ci:
    uses: lalalili/.github/.github/workflows/php-package-ci.yml@main
    secrets:
      composer-token: ${{ secrets.COMPOSER_GITHUB_TOKEN }}
    with:
      php-versions: "['8.4']"
      run-validate: false
      run-format: true

  # 共用的 php-package-ci 只跑 PHP。Builder 前端（Vue/TS）另有 138 個 vitest 測試，
  # 先前完全不在 CI 覆蓋範圍內——4 個測試檔曾長期整檔載入失敗而無人察覺。
  js:
    name: JS tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tests
        run: pnpm vitest run
